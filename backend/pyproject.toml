[project]
name = "curanex-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["vendor", ".venv", "uploads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008"]  # FastAPI's File(...) defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/**" = ["S101", "S108", "E501"]
"api/safety/rules.py" = ["E501"]  # patterns stay byte-identical to src/lib/safety.ts  # sandbox scripts stop on failed checks; long docker commands in docstrings

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
