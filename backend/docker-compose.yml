# Run from backend/:  docker compose up --build
# Host ports can be changed if busy, e.g.  API_PORT=8002 WORKER_TABULAR_PORT=8111 docker compose up
# Postgres is added in phase B6 (accounts + sync).
services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["${API_PORT:-8000}:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_TABULAR_URL: http://worker-tabular:8000
      WORKER_TORCH_URL: http://worker-torch:8000
      WORKER_TF_URL: http://worker-tf:8000
    volumes:
      - uploads:/data/uploads
    depends_on: [redis, worker-tabular, worker-torch, worker-tf]

  worker-tabular:
    build: { context: ., dockerfile: workers/tabular/Dockerfile }
    ports: ["${WORKER_TABULAR_PORT:-8101}:8000"]

  worker-torch:
    build: { context: ., dockerfile: workers/torch/Dockerfile }
    ports: ["${WORKER_TORCH_PORT:-8102}:8000"]

  worker-tf:
    build: { context: ., dockerfile: workers/tf/Dockerfile }
    ports: ["${WORKER_TF_PORT:-8103}:8000"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  uploads:
